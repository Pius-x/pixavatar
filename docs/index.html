<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixavatar · GitHub 风格头像生成器</title>
<meta name="description" content="在浏览器里生成 GitHub 风格头像：identicon、字母、自定义像素图案，支持种子复现和高清下载。">
<style>
  :root {
    --fg: #24292f; --muted: #57606a; --line: #d0d7de; --bg: #f6f8fa;
    --card: #ffffff; --accent: #0969da; --accent-soft: #ddf4ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px 56px; background: var(--bg); color: var(--fg);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  header { max-width: 1080px; margin: 0 auto 22px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: -.2px; }
  header p { margin: 0; color: var(--muted); }
  header a { margin-left: auto; color: var(--accent); text-decoration: none; }
  main { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .preview { display: flex; flex-direction: column; gap: 14px; }
  .stage { display: grid; place-items: center; background:
      linear-gradient(45deg, #eceff2 25%, transparent 25%, transparent 75%, #eceff2 75%),
      linear-gradient(45deg, #eceff2 25%, transparent 25%, transparent 75%, #eceff2 75%);
    background-size: 18px 18px; background-position: 0 0, 9px 9px;
    border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  canvas { width: min(100%, 460px); height: auto; border-radius: 50%; background: transparent; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    font: inherit; border-radius: 8px; border: 1px solid var(--line); background: #f6f8fa;
    color: var(--fg); padding: 7px 14px; cursor: pointer; transition: .15s;
  }
  button:hover { background: #eef1f4; }
  button.primary { background: #1f883d; border-color: #1a7f37; color: #fff; }
  button.primary:hover { background: #1a7f37; }
  button.ghost { background: transparent; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 16px; }
  .tabs button { border-radius: 8px; }
  .tabs button[aria-selected="true"] { background: var(--accent-soft); border-color: #54aeff; color: #0a3069; font-weight: 600; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .row { display: flex; gap: 8px; align-items: center; }
  input[type="number"], input[type="text"], select, textarea {
    font: inherit; width: 100%; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--fg);
  }
  textarea { font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.5; resize: vertical; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
  .swatch[data-active="true"] { box-shadow: 0 0 0 2px var(--accent); }
  input[type="color"] { width: 38px; height: 30px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .hidden { display: none !important; }
  footer { max-width: 1080px; margin: 26px auto 0; color: var(--muted); font-size: 12px; }
  footer a { color: var(--accent); }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>pixavatar</h1>
  <p>GitHub 风格头像生成器 · 纯浏览器运行</p>
  <a href="https://github.com/Pius-x/pixavatar">GitHub</a>
</header>

<main>
  <section class="card preview">
    <div class="stage"><canvas id="preview" width="512" height="512"></canvas></div>
    <div class="actions">
      <button class="primary" id="download">下载 PNG（1024×1024）</button>
      <button id="shuffle">换一个</button>
      <button class="ghost" id="random-color">随机配色</button>
    </div>
  </section>

  <aside class="card">
    <div class="tabs" role="tablist">
      <button role="tab" data-mode="identicon" aria-selected="true">Identicon</button>
      <button role="tab" data-mode="letter" aria-selected="false">字母</button>
      <button role="tab" data-mode="custom" aria-selected="false">自定义</button>
    </div>

    <div id="panel-identicon">
      <div class="field">
        <label for="seed">种子（同一个种子生成同一个形状）</label>
        <div class="row">
          <input type="number" id="seed" value="42">
          <button id="reseed" title="随机种子">🎲</button>
        </div>
      </div>
      <div class="field">
        <label for="grid">网格</label>
        <select id="grid">
          <option value="5" selected>5 × 5</option>
          <option value="7">7 × 7</option>
          <option value="9">9 × 9</option>
        </select>
      </div>
    </div>

    <div id="panel-letter" class="hidden">
      <div class="field">
        <label for="letter">字母</label>
        <select id="letter">
          <option>A</option><option>B</option><option>C</option><option>D</option><option>E</option>
          <option>F</option><option>G</option><option>H</option><option>I</option><option>J</option>
          <option>K</option><option>L</option><option>M</option><option>N</option><option>O</option>
          <option>P</option><option>Q</option><option>R</option><option>S</option><option>T</option>
          <option>U</option><option>V</option><option>W</option><option selected>X</option><option>Y</option><option>Z</option>
        </select>
      </div>
      <div class="field">
        <label for="letter-grid">网格</label>
        <select id="letter-grid">
          <option value="5">5 × 5</option>
          <option value="7" selected>7 × 7</option>
        </select>
      </div>
    </div>

    <div id="panel-custom" class="hidden">
      <div class="field">
        <label for="mask">图案（每行一个字符串，写左半边，0 = 空，1 = 填充，右侧自动镜像）</label>
        <textarea id="mask" rows="6">010
111
111
011
001</textarea>
        <div class="hint">行数 = 网格数；列数 = ceil(网格数 / 2)。</div>
      </div>
    </div>

    <div class="field">
      <label>前景色</label>
      <div class="row">
        <div class="swatches" id="fg-swatches"></div>
        <input type="color" id="fg" value="#2ea44f">
      </div>
    </div>

    <div class="field">
      <label>背景</label>
      <div class="row">
        <div class="swatches" id="bg-swatches"></div>
        <input type="color" id="bg" value="#ffffff">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg)">
          <input type="checkbox" id="transparent" style="width:auto"> 透明
        </label>
      </div>
    </div>

    <div class="field">
      <label for="ratio">图形占比 <span id="ratio-value">60%</span></label>
      <input type="range" id="ratio" min="40" max="90" value="60">
      <div class="hint">留白越多，放进圆形头像框后越不容易贴边。</div>
    </div>
  </aside>
</main>

<footer>
  算法致敬 <a href="https://github.com/afkbrb/github-avatar-generator">afkbrb/github-avatar-generator</a>，MIT 许可。
</footer>

<script>
const GLYPHS = {
  A: ["00100","01110","10001","11111","10001","10001","10001"],
  B: ["11110","10001","11110","10001","10001","10001","11110"],
  C: ["01110","10001","10000","10000","10000","10001","01110"],
  D: ["11110","10001","10001","10001","10001","10001","11110"],
  E: ["11111","10000","11110","10000","10000","10000","11111"],
  F: ["11111","10000","11110","10000","10000","10000","10000"],
  G: ["01110","10001","10000","10111","10001","10001","01110"],
  H: ["10001","10001","11111","10001","10001","10001","10001"],
  I: ["11111","00100","00100","00100","00100","00100","11111"],
  J: ["00111","00010","00010","00010","00010","10010","01100"],
  K: ["10001","10010","10100","11000","10100","10010","10001"],
  L: ["10000","10000","10000","10000","10000","10000","11111"],
  M: ["10001","11011","10101","10001","10001","10001","10001"],
  N: ["10001","11001","10101","10011","10001","10001","10001"],
  O: ["01110","10001","10001","10001","10001","10001","01110"],
  P: ["11110","10001","10001","11110","10000","10000","10000"],
  Q: ["01110","10001","10001","10001","10101","10010","01101"],
  R: ["11110","10001","10001","11110","10100","10010","10001"],
  S: ["01111","10000","01110","00001","00001","10001","01110"],
  T: ["11111","00100","00100","00100","00100","00100","00100"],
  U: ["10001","10001","10001","10001","10001","10001","01110"],
  V: ["10001","10001","10001","10001","10001","01010","00100"],
  W: ["10001","10001","10001","10101","10101","11011","10001"],
  X: ["10001","01010","00100","00100","00100","01010","10001"],
  Y: ["10001","01010","00100","00100","00100","00100","00100"],
  Z: ["11111","00001","00010","00100","01000","10000","11111"],
};

const PALETTE = ["2EA44F","0969DA","8250DF","BF3989","D1242F","E36209","1B7C83","B8860B"];
const BACKGROUNDS = [
  { hex: "FFFFFF", label: "白" },
  { hex: "F1F1F1", label: "浅灰" },
  { hex: "22272E", label: "深灰" },
];

const state = {
  mode: "identicon",
  seed: 42,
  grid: 5,
  letter: "X",
  letterGrid: 7,
  mask: "010\n111\n111\n011\n001",
  fg: "#2ea44f",
  bg: "#ffffff",
  transparent: false,
  ratio: 0.6,
};

const $ = (id) => document.getElementById(id);

// 确定性随机数：同一 seed 永远产生同一序列
function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function checkColor(r, g, b) {
  const bright = 210, dark = 200, gray = 30;
  if (r < bright && g < bright && b < bright) return false;
  if (r > dark && g > dark && b > dark) return false;
  if (Math.abs(r - g) < gray && Math.abs(g - b) < gray && Math.abs(b - r) < gray) return false;
  return true;
}

function randomColorStr() {
  for (;;) {
    const r = Math.floor(Math.random() * 255);
    const g = Math.floor(Math.random() * 255);
    const b = Math.floor(Math.random() * 255);
    if (checkColor(r, g, b)) return "#" + [r, g, b].map((v) => v.toString(16).padStart(2, "0")).join("");
  }
}

function generateCells(n, rng, dmin = 0.3, dmax = 0.8) {
  const half = Math.ceil(n / 2);
  const halfSquare = Math.floor(n / 2) * n;
  const low = Math.floor(dmin * halfSquare);
  const high = Math.ceil(dmax * halfSquare);
  for (;;) {
    const grid = Array.from({ length: n }, () => new Array(n).fill(0));
    let filled = 0;
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < half; c++) {
        const v = rng() < 0.5 ? 0 : 1;
        grid[r][c] = v;
        grid[r][n - 1 - c] = v;
        filled += v;
      }
    }
    if (filled >= low && filled <= high) return grid;
  }
}

function cellsFromMask(rows, n) {
  const half = Math.ceil(n / 2);
  const grid = Array.from({ length: n }, () => new Array(n).fill(0));
  for (let r = 0; r < n; r++) {
    const row = (rows[r] || "").trim();
    for (let c = 0; c < Math.min(half, row.length); c++) {
      const v = row[c] === "1" ? 1 : 0;
      grid[r][c] = v;
      grid[r][n - 1 - c] = v;
    }
  }
  return grid;
}

function cellsFromLetter(letter, n) {
  const glyph = GLYPHS[(letter || "A").toUpperCase()] || GLYPHS.A;
  const rows = [];
  for (let i = 0; i < n; i++) {
    rows.push(glyph[Math.round((i * 6) / (n - 1))]);
  }
  return rows.map((row) =>
    Array.from({ length: n }, (_, c) => (row[Math.round((c * 4) / (n - 1))] === "1" ? 1 : 0))
  );
}

function currentGrid() {
  if (state.mode === "letter") return cellsFromLetter(state.letter, state.letterGrid);
  if (state.mode === "custom") {
    const rows = state.mask.split("\n").map((r) => r.trim()).filter((r) => r.length);
    const n = rows.length || 5;
    return cellsFromMask(rows, n);
  }
  const rng = mulberry32(state.seed >>> 0);
  return generateCells(state.grid, rng);
}

function draw(canvas, size) {
  const grid = currentGrid();
  const n = grid.length;
  const cell = Math.floor((size * state.ratio) / n);
  const pad = Math.floor((size - n * cell) / 2);

  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, size, size);
  if (!state.transparent) {
    ctx.fillStyle = state.bg;
    ctx.fillRect(0, 0, size, size);
  }
  ctx.fillStyle = state.fg;
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (!grid[r][c]) continue;
      ctx.fillRect(pad + c * cell, pad + r * cell, cell, cell);
    }
  }
}

function render() {
  draw($("preview"), 512);
}

function syncControls() {
  document.querySelectorAll("[data-mode]").forEach((btn) => {
    btn.setAttribute("aria-selected", String(btn.dataset.mode === state.mode));
  });
  $("panel-identicon").classList.toggle("hidden", state.mode !== "identicon");
  $("panel-letter").classList.toggle("hidden", state.mode !== "letter");
  $("panel-custom").classList.toggle("hidden", state.mode !== "custom");
  $("ratio-value").textContent = Math.round(state.ratio * 100) + "%";
  render();
}

function buildSwatches(container, colors, onPick, activeHex) {
  container.innerHTML = "";
  colors.forEach((hex) => {
    const btn = document.createElement("button");
    btn.className = "swatch";
    btn.style.background = "#" + hex;
    btn.dataset.active = String("#" + hex.toLowerCase() === activeHex.toLowerCase());
    btn.title = "#" + hex;
    btn.addEventListener("click", () => {
      onPick("#" + hex.toLowerCase());
      syncControls();
    });
    container.appendChild(btn);
  });
}

function init() {
  buildSwatches($("fg-swatches"), PALETTE, (hex) => {
    state.fg = hex;
    $("fg").value = hex;
  }, "#2ea44f");

  const bgColors = BACKGROUNDS.map((b) => b.hex);
  buildSwatches($("bg-swatches"), bgColors, (hex) => {
    state.bg = hex;
    state.transparent = false;
    $("bg").value = hex;
    $("transparent").checked = false;
  }, "#ffffff");

  document.querySelectorAll("[data-mode]").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.mode = btn.dataset.mode;
      syncControls();
    });
  });

  $("seed").addEventListener("input", (e) => {
    state.seed = Number(e.target.value) || 0;
    render();
  });
  $("reseed").addEventListener("click", () => {
    state.seed = Math.floor(Math.random() * 1e9);
    $("seed").value = state.seed;
    render();
  });
  $("grid").addEventListener("change", (e) => {
    state.grid = Number(e.target.value);
    render();
  });
  $("letter").addEventListener("change", (e) => {
    state.letter = e.target.value;
    render();
  });
  $("letter-grid").addEventListener("change", (e) => {
    state.letterGrid = Number(e.target.value);
    render();
  });
  $("mask").addEventListener("input", (e) => {
    state.mask = e.target.value;
    render();
  });
  $("fg").addEventListener("input", (e) => {
    state.fg = e.target.value;
    render();
  });
  $("bg").addEventListener("input", (e) => {
    state.bg = e.target.value;
    state.transparent = false;
    $("transparent").checked = false;
    render();
  });
  $("transparent").addEventListener("change", (e) => {
    state.transparent = e.target.checked;
    render();
  });
  $("ratio").addEventListener("input", (e) => {
    state.ratio = Number(e.target.value) / 100;
    syncControls();
  });
  $("shuffle").addEventListener("click", () => {
    state.seed = Math.floor(Math.random() * 1e9);
    $("seed").value = state.seed;
    render();
  });
  $("random-color").addEventListener("click", () => {
    state.fg = randomColorStr();
    $("fg").value = state.fg;
    buildSwatches($("fg-swatches"), PALETTE, (hex) => {
      state.fg = hex;
      $("fg").value = hex;
      syncControls();
    }, state.fg);
    render();
  });
  $("download").addEventListener("click", () => {
    const canvas = document.createElement("canvas");
    draw(canvas, 1024);
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `pixavatar-${state.mode}-${state.seed}.png`;
      a.click();
      URL.revokeObjectURL(url);
    }, "image/png");
  });

  syncControls();
}

init();
</script>
</body>
</html>
